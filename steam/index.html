<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Steam Library · Portal</title>
<style>
:root {
  --bg:        #0d1010;
  --surface:   #141918;
  --surface-2: #1b2120;
  --border:    #263030;
  --border-2:  #324040;
  --text:      #dde5e3;
  --muted:     #8fa89e;
  --faint:     #5c726a;
  --accent:    #b8965a;
  --ok:        #5aab7f;
  --warn:      #c9924a;
  --crit:      #c45a5a;
  --mono:      "SFMono-Regular", Consolas, "Cascadia Mono", Menlo, monospace;
  --sans:      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* topbar */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(13,16,16,.96); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 48px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-brand { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.topbar-title { font-size: 13px; font-weight: 600; color: var(--text); }
.topbar-meta { font-size: 11px; color: var(--faint); }
.topbar-back { font-size: 11px; color: var(--faint); text-decoration: none; }
.topbar-back:hover { color: var(--muted); }

.wrap { max-width: 1300px; margin: 0 auto; padding: 28px 24px 60px; }

.stats-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  padding: 12px 18px; border-left: 3px solid var(--border-2);
}
.stat-box .label { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
.stat-box .value { color: var(--accent); font-size: 22px; font-weight: 700; font-family: var(--mono); margin-top: 2px; }

.controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.controls input, .controls select {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 7px 10px; border-radius: 4px;
  font-size: 13px; font-family: var(--sans);
}
.controls input { width: 240px; }
.controls input::placeholder { color: var(--faint); }
.controls select { cursor: pointer; }
.controls input:focus, .controls select:focus { outline: none; border-color: var(--accent); }

.filter-btn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12.5px;
  font-family: var(--sans);
}
.filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); }

.refresh-btn {
  background: var(--ok); color: #0d1010; border: none; padding: 7px 14px;
  border-radius: 4px; font-size: 13px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans);
}
.refresh-btn:hover { filter: brightness(1.1); }
.refresh-btn:disabled { background: var(--surface-2); color: var(--faint); cursor: not-allowed; }
.refresh-btn .spinner {
  display: none; width: 13px; height: 13px; border: 2px solid #0d1010;
  border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;
}
.refresh-btn.loading .spinner { display: inline-block; }
.refresh-btn.loading .label { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--surface); color: var(--faint);
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  padding: 9px 12px; text-align: left;
  cursor: pointer; user-select: none; position: sticky; top: 48px; white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
thead th:hover { color: var(--text); }
thead th .arrow { font-size: 9px; margin-left: 3px; }
tbody tr { border-bottom: 1px solid var(--surface-2); transition: background .1s; }
tbody tr:hover { background: var(--surface); }
tbody td { padding: 7px 12px; color: var(--muted); }

td.name-cell a { color: var(--text); text-decoration: none; font-weight: 500; }
td.name-cell a:hover { color: var(--accent); }
.genre-tags { font-size: 10px; color: var(--faint); margin-top: 2px; }
.players-cell { font-weight: 700; font-family: var(--mono); color: var(--text); }

.status-badge {
  display: inline-block; padding: 1px 7px; border-radius: 3px;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
}
.status-massive  { background: rgba(90,171,127,.2);  color: #6fca9e; border: 1px solid rgba(90,171,127,.3); }
.status-thriving { background: rgba(90,171,127,.12); color: #5aab7f; border: 1px solid rgba(90,171,127,.2); }
.status-active   { background: rgba(184,150,90,.15); color: var(--accent); border: 1px solid rgba(184,150,90,.3); }
.status-moderate { background: rgba(201,146,74,.12); color: var(--warn); border: 1px solid rgba(201,146,74,.25); }
.status-low      { background: rgba(196,90,90,.12);  color: #d4837a; border: 1px solid rgba(196,90,90,.25); }
.status-dead     { background: rgba(92,114,106,.1);  color: var(--faint); border: 1px solid var(--border); }

.type-badge {
  display: inline-block; padding: 1px 7px; border-radius: 3px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
}
.type-mmo        { background: rgba(154,127,196,.15); color: #b09adc; border: 1px solid rgba(154,127,196,.3); }
.type-pvp        { background: rgba(196,90,90,.15);   color: #d4837a; border: 1px solid rgba(196,90,90,.3); }
.type-pvpcoop    { background: rgba(201,146,74,.15);  color: var(--warn); border: 1px solid rgba(201,146,74,.3); }
.type-onlinecoop { background: rgba(90,171,127,.15);  color: var(--ok); border: 1px solid rgba(90,171,127,.3); }
.type-coop       { background: rgba(90,171,127,.1);   color: #5aab7f; border: 1px solid rgba(90,171,127,.2); }
.type-multiplayer{ background: rgba(107,159,196,.15); color: #7ab4d8; border: 1px solid rgba(107,159,196,.3); }
.type-localmp    { background: rgba(107,159,196,.1);  color: #6ba8ce; border: 1px solid rgba(107,159,196,.2); }
.type-singleplayer{ background: rgba(92,114,106,.12); color: var(--muted); border: 1px solid var(--border); }
.type-utility    { background: rgba(92,114,106,.08);  color: var(--faint); border: 1px solid var(--border); }
.type-unknown    { background: transparent; color: var(--faint); border: 1px solid var(--border); }

.hours-bar {
  display: inline-block; height: 5px; background: var(--accent);
  border-radius: 2px; vertical-align: middle; margin-left: 8px; opacity: 0.5;
}
.play-btn {
  display: inline-block; background: var(--surface-2); color: var(--ok);
  border: 1px solid rgba(90,171,127,.3);
  padding: 2px 9px; border-radius: 3px; font-size: 11px;
  font-weight: 700; text-decoration: none; letter-spacing: .04em;
}
.play-btn:hover { border-color: var(--ok); background: rgba(90,171,127,.1); }

tr.detail-row td { padding: 0; border-bottom: 1px solid var(--surface-2); }
.detail-panel {
  display: none; padding: 10px 16px 12px 44px;
  background: var(--surface); font-size: 12.5px; color: var(--muted);
}
.detail-panel.open { display: block; }
.detail-panel .dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
.detail-panel .dl dt { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
.detail-panel .dl dd { margin: 0; }
.detail-panel .genre-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.detail-panel .genre-list span {
  padding: 1px 7px; border-radius: 3px; font-size: 10.5px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
}
tbody tr.expandable { cursor: pointer; }
tbody tr.expandable:hover { background: var(--surface); }
tbody tr.expandable.expanded { background: var(--surface); }

@media (max-width: 800px) {
  table { font-size: 12px; }
  td, th { padding: 6px 8px; }
  .hours-bar, .genre-tags { display: none; }
}
@media print {
  body { background: #fff; color: #111; }
  .topbar, .controls, .refresh-btn, .play-btn, .filter-btn { display: none; }
  .wrap { padding: 10px; }
  table { font-size: 11px; }
  th { color: #555; }
  td { color: #333; border-bottom-color: #eee; }
  .stat-box { border-color: #ccc; background: #f9f9f9; }
  .stat-box .value { color: #333; }
  .stat-box .label { color: #666; }
  .status-badge, .type-badge { border-color: #aaa; background: #f0f0f0; color: #333; }
}
</style>
</head>

</div>

    </tr>
  </thead>
  <tbody id="game-table"></tbody>
</table>
</div>

const maxHours = Math.max(...GAMES.map(g => g.hours));
let sortCol = 'hours';
let sortDir = -1;
let hideUtility = false;

function getStatus(p) {
  if (p <= 0)    return { label: 'Dead',     cls: 'status-dead' };
  if (p < 100)   return { label: 'Low',      cls: 'status-low' };
  if (p < 1000)  return { label: 'Moderate', cls: 'status-moderate' };
  if (p < 10000) return { label: 'Active',   cls: 'status-active' };
  if (p < 50000) return { label: 'Thriving', cls: 'status-thriving' };
  return            { label: 'Massive',  cls: 'status-massive' };
}

function getTypeCls(type) {
  const map = {
    'MMO':'type-mmo','PvP':'type-pvp','PvP + Co-op':'type-pvpcoop',
    'Online Co-op':'type-onlinecoop','Co-op':'type-coop','Multiplayer':'type-multiplayer',
    'Local MP':'type-localmp','Single-Player':'type-singleplayer',
    'Utility':'type-utility','Unknown':'type-unknown'
  };
  return map[type] || 'type-unknown';
}

const TYPE_ORDER = ['MMO','PvP','PvP + Co-op','Online Co-op','Co-op','Multiplayer','Local MP','Single-Player','Utility','Unknown'];

function fmt(n) { return n < 0 ? 'N/A' : n.toLocaleString(); }

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const statusFilter = document.getElementById('status-filter').value;
  const typeFilter = document.getElementById('type-filter').value;

  let filtered = GAMES.filter(g => {
    if (hideUtility && (g.utility || g.type === 'Utility')) return false;
    if (search && !g.name.toLowerCase().includes(search)) return false;
    if (statusFilter !== 'all') {
      if (getStatus(g.players).label.toLowerCase() !== statusFilter) return false;
    }
    if (typeFilter !== 'all' && g.type !== typeFilter) return false;
    return true;
  });

  filtered.sort((a, b) => {
    let va, vb;
    if (sortCol === 'name') { return sortDir * a.name.toLowerCase().localeCompare(b.name.toLowerCase()); }
    if (sortCol === 'type') { va = TYPE_ORDER.indexOf(a.type); vb = TYPE_ORDER.indexOf(b.type); }
    else if (sortCol === 'hours') { va = a.hours; vb = b.hours; }
    else if (sortCol === 'players' || sortCol === 'status') { va = a.players; vb = b.players; }
    else { va = GAMES.indexOf(a); vb = GAMES.indexOf(b); }
    return sortDir * (va - vb);
  });

  const totalGames = filtered.length;
  const totalHours = filtered.reduce((s, g) => s + g.hours, 0);
  const alive = filtered.filter(g => g.players >= 1000).length;
  const dead = filtered.filter(g => g.players <= 0).length;

  const statsBar = document.getElementById('stats-bar');
  statsBar.replaceChildren();
  [{label:'Games Shown',value:totalGames},{label:'Total Hours',value:totalHours.toLocaleString()},{label:'Active (1K+)',value:alive},{label:'Dead (0)',value:dead}].forEach(sd => {
    const box = document.createElement('div'); box.className = 'stat-box';
    const lbl = document.createElement('div'); lbl.className = 'label'; lbl.textContent = sd.label;
    const val = document.createElement('div'); val.className = 'value'; val.textContent = sd.value;
    box.appendChild(lbl); box.appendChild(val); statsBar.appendChild(box);
  });

  const tbody = document.getElementById('game-table');
  tbody.replaceChildren();
  filtered.forEach((g, i) => {
    const st = getStatus(g.players);
    const barW = Math.max(2, (g.hours / maxHours) * 120);
    const tr = document.createElement('tr');
    tr.className = 'expandable';
    tr.dataset.idx = String(i);

    const tdNum = document.createElement('td');
    tdNum.textContent = i + 1;
    tr.appendChild(tdNum);

    const tdName = document.createElement('td');
    tdName.className = 'name-cell';
    const nameLink = document.createElement('a');
    nameLink.href = 'https://store.steampowered.com/app/' + g.appid;
    nameLink.target = '_blank';
    nameLink.textContent = g.name;
    tdName.appendChild(nameLink);
    if (g.genres && g.genres.length) {
      const genreDiv = document.createElement('div');
      genreDiv.className = 'genre-tags';
      genreDiv.textContent = g.genres.join(' / ');
      tdName.appendChild(genreDiv);
    }
    tr.appendChild(tdName);

    const tdType = document.createElement('td');
    const typeBadge = document.createElement('span');
    typeBadge.className = 'type-badge ' + getTypeCls(g.type || 'Unknown');
    typeBadge.textContent = g.type || 'Unknown';
    tdType.appendChild(typeBadge);
    tr.appendChild(tdType);

    const tdHours = document.createElement('td');
    tdHours.appendChild(document.createTextNode(g.hours.toLocaleString() + 'h '));
    const bar = document.createElement('span');
    bar.className = 'hours-bar'; bar.style.width = barW + 'px';
    tdHours.appendChild(bar);
    tr.appendChild(tdHours);

    const tdPlayers = document.createElement('td');
    tdPlayers.className = 'players-cell';
    tdPlayers.textContent = fmt(g.players);
    tr.appendChild(tdPlayers);

    const tdStatus = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = 'status-badge ' + st.cls;
    badge.textContent = st.label;
    tdStatus.appendChild(badge);
    tr.appendChild(tdStatus);

    const tdPlay = document.createElement('td');
    const playLink = document.createElement('a');
    playLink.className = 'play-btn';
    playLink.href = 'steam://rungameid/' + g.appid;
    playLink.textContent = 'Play';
    tdPlay.appendChild(playLink);
    tr.appendChild(tdPlay);

    tbody.appendChild(tr);

    const detailTr = document.createElement('tr');
    detailTr.className = 'detail-row';
    const detailTd = document.createElement('td');
    detailTd.colSpan = 7;
    const panel = document.createElement('div');
    panel.className = 'detail-panel';
    panel.innerHTML = '<div class="dl">'
      +'<dt>App ID</dt><dd>'+g.appid+'</dd>'
      +'<dt>Type</dt><dd>'+(g.type||'Unknown')+'</dd>'
      +'<dt>Hours</dt><dd>'+g.hours.toLocaleString()+'h</dd>'
      +'<dt>Players</dt><dd>'+fmt(g.players)+'</dd>'
      +'</div>'
      +(g.genres&&g.genres.length?'<div class="genre-list">'+g.genres.map(x=>'<span>'+x+'</span>').join('')+'</div>':'');
    detailTd.appendChild(panel);
    detailTr.appendChild(detailTd);
    tbody.appendChild(detailTr);

    tr.addEventListener('click', () => {
      const isOpen = tr.classList.contains('expanded');
      tr.classList.toggle('expanded', !isOpen);
      panel.classList.toggle('open', !isOpen);
    });
  });

  document.querySelectorAll('thead th').forEach(th => {
    const col = th.dataset.sort;
    const arrow = th.querySelector('.arrow');
    if (arrow) arrow.textContent = col === sortCol ? (sortDir === 1 ? ' \u25B2' : ' \u25BC') : '';
  });
}

document.querySelectorAll('thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = col === 'name' ? 1 : -1; }
    render();
  });
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('status-filter').addEventListener('change', render);
document.getElementById('type-filter').addEventListener('change', render);

document.getElementById('hide-utility-btn').addEventListener('click', () => {
  hideUtility = !hideUtility;
  document.getElementById('hide-utility-btn').classList.toggle('active', hideUtility);
  render();
});

// --- Live refresh via CORS proxy ---
document.getElementById('refresh-btn').addEventListener('click', async () => {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.classList.add('loading');
  let updated = 0;
  const batchSize = 5;
  for (let i = 0; i < GAMES.length; i += batchSize) {
    const batch = GAMES.slice(i, i + batchSize);
    const fetches = batch.map(g => {
      const apiUrl = 'https://api.steampowered.com/ISteamUserStats/GetNumberOfCurrentPlayers/v1/?appid=' + g.appid;
      const proxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(apiUrl);
      return fetch(proxy, { signal: AbortSignal.timeout(8000) })
        .then(r => r.json())
        .then(j => { if (j.response && j.response.player_count !== undefined) { g.players = j.response.player_count; updated++; } })
        .catch(() => {});
    });
    await Promise.all(fetches);
    render();
    if (i + batchSize < GAMES.length) await new Promise(r => setTimeout(r, 300));
  }
  const dateSpan = document.getElementById('fetch-date');
  if (dateSpan) dateSpan.textContent = new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
  btn.disabled = false;
  btn.classList.remove('loading');
});

document.getElementById('btn-csv').addEventListener('click', () => {
  const search = document.getElementById('search').value.toLowerCase();
  const statusFilter = document.getElementById('status-filter').value;
  const typeFilter = document.getElementById('type-filter').value;
  let filtered = GAMES.filter(g => {
    if (hideUtility && (g.utility || g.type === 'Utility')) return false;
    if (search && !g.name.toLowerCase().includes(search)) return false;
    if (statusFilter !== 'all' && getStatus(g.players).label.toLowerCase() !== statusFilter) return false;
    if (typeFilter !== 'all' && g.type !== typeFilter) return false;
    return true;
  });
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv = ["name,type,hours,players,status,genres"].concat(
    filtered.map(g => [q(g.name),q(g.type),g.hours,g.players,q(getStatus(g.players).label),q((g.genres||[]).join('; '))].join(","))
  ).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download = "steam-library-"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
});

document.getElementById('btn-print').addEventListener('click', () => window.print());

render();

(function(){
  function loadFreshness(){
    fetch('/freshness.json?t='+Date.now()).then(r=>r.json()).then(f=>{
      const e=f['steam'];
      document.getElementById('topbar-updated').textContent='Updated '+(e?e.as_of:'unknown');
    }).catch(()=>{document.getElementById('topbar-updated').textContent='Updated: unknown';});
  }
  loadFreshness();
  document.getElementById('topbar-refresh').addEventListener('click',function(){
    this.textContent='...';const btn=this;
    location.reload();
  });
})();
</script>
