<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RapidAPI Explorer · Portal</title>
<style>
:root {
  --bg:        #0d1010;
  --surface:   #141918;
  --surface-2: #1b2120;
  --border:    #263030;
  --border-2:  #324040;
  --text:      #dde5e3;
  --muted:     #8fa89e;
  --faint:     #5c726a;
  --accent:    #b8965a;
  --ok:        #5aab7f;
  --warn:      #c9924a;
  --crit:      #c45a5a;
  --mono:      "SFMono-Regular", Consolas, "Cascadia Mono", Menlo, monospace;
  --sans:      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(13,16,16,.96); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 48px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-brand { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.topbar-title { font-size: 13px; font-weight: 600; color: var(--text); }
.topbar-back { font-size: 11px; color: var(--faint); text-decoration: none; }
.topbar-back:hover { color: var(--muted); }

.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }

.stats-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  padding: 12px 18px; border-left: 3px solid var(--border-2);
}
.stat-box .label { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
.stat-box .value { color: var(--accent); font-size: 22px; font-weight: 700; font-family: var(--mono); margin-top: 2px; }

.controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.controls input[type=search] {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 7px 12px; border-radius: 4px;
  font-size: 13px; font-family: var(--sans); min-width: 240px; flex: 1 1 240px;
}
.controls input::placeholder { color: var(--faint); }
.controls input:focus { outline: none; border-color: var(--accent); }
.controls select {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 7px 10px; border-radius: 4px;
  font-size: 13px; cursor: pointer; font-family: var(--sans);
}
.controls select:focus { outline: none; border-color: var(--accent); }
.tbtn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  color: var(--muted); padding: 7px 12px; font-size: 12px; cursor: pointer;
  font-family: var(--sans); white-space: nowrap;
}
.tbtn:hover { border-color: var(--accent); color: var(--accent); }

.api-grid { display: grid; gap: 12px; }

.api-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 16px 18px; cursor: pointer; transition: border-color .15s;
}
.api-card:hover { border-color: var(--border-2); }
.api-card.expanded { border-color: var(--accent); }

.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-name { font-size: 15px; font-weight: 600; color: var(--text); }
.card-host { font-size: 11.5px; font-family: var(--mono); color: var(--faint); margin-top: 2px; }
.card-desc { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

.card-meta { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.cat-badge {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  background: rgba(184,150,90,.12); color: var(--accent); border: 1px solid rgba(184,150,90,.25);
}
.cat-badge.cat-security { background: rgba(196,90,90,.12); color: var(--crit); border-color: rgba(196,90,90,.25); }
.cat-badge.cat-social { background: rgba(107,159,196,.12); color: #7ab4d8; border-color: rgba(107,159,196,.25); }
.plan-badge {
  font-size: 10.5px; font-weight: 600; color: var(--faint);
  padding: 2px 7px; border: 1px solid var(--border); border-radius: 3px;
}

.quota-wrap { flex: 1; min-width: 140px; max-width: 260px; }
.quota-label { font-size: 10px; color: var(--faint); margin-bottom: 3px; font-family: var(--mono); }
.quota-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.quota-fill { height: 100%; border-radius: 3px; transition: width .3s; }
.quota-fill.low { background: var(--ok); }
.quota-fill.mid { background: var(--warn); }
.quota-fill.high { background: var(--crit); }

.card-detail { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.api-card.expanded .card-detail { display: block; }

.endpoint-list { list-style: none; }
.endpoint-item {
  display: flex; align-items: baseline; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid var(--surface-2);
  font-size: 12.5px;
}
.endpoint-item:last-child { border-bottom: none; }
.method-badge {
  font-size: 10px; font-weight: 700; font-family: var(--mono);
  padding: 2px 6px; border-radius: 3px; min-width: 42px; text-align: center;
}
.method-GET { background: rgba(90,171,127,.15); color: var(--ok); border: 1px solid rgba(90,171,127,.3); }
.method-POST { background: rgba(184,150,90,.15); color: var(--accent); border: 1px solid rgba(184,150,90,.3); }
.method-PUT { background: rgba(107,159,196,.15); color: #7ab4d8; border: 1px solid rgba(107,159,196,.3); }
.method-DELETE { background: rgba(196,90,90,.15); color: var(--crit); border: 1px solid rgba(196,90,90,.3); }
.ep-path { font-family: var(--mono); color: var(--text); }
.ep-desc { color: var(--muted); }

.no-results { padding: 40px; text-align: center; color: var(--faint); font-size: 13px; }
.expand-hint { font-size: 11px; color: var(--faint); margin-top: 6px; }

@media (max-width: 600px) {
  .card-header { flex-direction: column; }
  .quota-wrap { max-width: 100%; }
}
@media print {
  body { background: #fff; color: #111; }
  .topbar, .controls { display: none; }
  .wrap { padding: 10px; }
  .api-card { border-color: #ccc; background: #f9f9f9; break-inside: avoid; }
  .api-card .card-detail { display: block; }
  .card-name { color: #111; }
  .card-desc, .ep-desc { color: #333; }
  .stat-box { border-color: #ccc; background: #f9f9f9; }
  .stat-box .value { color: #333; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand">Portal</span>
    <span class="topbar-title">RapidAPI Explorer</span>
  </div>
  <a href="/playgrounds/" class="topbar-back">&larr; Playgrounds</a>
</div>

<div class="wrap">
<div class="stats-bar" id="stats-bar"></div>

<div class="controls">
  <input type="search" id="search" placeholder="Search APIs, hosts, endpoints...">
  <select id="cat-filter">
    <option value="all">All Categories</option>
  </select>
  <button class="tbtn" id="btn-print">Print / PDF</button>
</div>

<div class="api-grid" id="api-grid"></div>
<div class="no-results" id="no-results" style="display:none">No APIs match the current filters.</div>
</div>

<script>
let APIS = [];

fetch('./rapidapi-catalog.json').then(r => r.json()).then(data => { APIS = data; init(); })
  .catch(() => { document.getElementById('no-results').style.display = 'block'; document.getElementById('no-results').textContent = 'Could not load rapidapi-catalog.json'; });

function init() {
  const cats = [...new Set(APIS.map(a => a.category))].sort();
  const sel = document.getElementById('cat-filter');
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
  render();
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const catFilter = document.getElementById('cat-filter').value;

  let filtered = APIS.filter(a => {
    if (catFilter !== 'all' && a.category !== catFilter) return false;
    if (search) {
      const haystack = (a.name + ' ' + a.host + ' ' + a.description + ' ' + a.endpoints.map(e => e.path + ' ' + e.description).join(' ')).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  const totalAPIs = filtered.length;
  const totalCats = new Set(filtered.map(a => a.category)).size;
  const totalCalls = filtered.reduce((s, a) => s + a.quota_used, 0);

  document.getElementById('stats-bar').innerHTML =
    [{l:'APIs', v:totalAPIs}, {l:'Categories', v:totalCats}, {l:'Calls This Month', v:totalCalls.toLocaleString()}]
    .map(s => '<div class="stat-box"><div class="label">'+s.l+'</div><div class="value">'+s.v+'</div></div>').join('');

  document.getElementById('no-results').style.display = filtered.length ? 'none' : 'block';

  document.getElementById('api-grid').innerHTML = filtered.map(a => {
    const pct = Math.round((a.quota_used / a.quota_limit) * 100);
    const fillClass = pct >= 90 ? 'high' : pct >= 60 ? 'mid' : 'low';
    const catClass = 'cat-' + a.category.toLowerCase();
    return '<div class="api-card" data-id="'+a.id+'">'
      +'<div class="card-header"><div><div class="card-name">'+esc(a.name)+'</div>'
      +'<div class="card-host">'+esc(a.host)+'</div></div></div>'
      +'<div class="card-desc">'+esc(a.description)+'</div>'
      +'<div class="card-meta">'
      +'<span class="cat-badge '+catClass+'">'+esc(a.category)+'</span>'
      +'<span class="plan-badge">'+esc(a.plan)+'</span>'
      +'<div class="quota-wrap"><div class="quota-label">'+a.quota_used+' / '+a.quota_limit+' ('+pct+'%)</div>'
      +'<div class="quota-bar"><div class="quota-fill '+fillClass+'" style="width:'+pct+'%"></div></div></div>'
      +'</div>'
      +'<div class="expand-hint">Click to view endpoints</div>'
      +'<div class="card-detail"><ul class="endpoint-list">'
      +a.endpoints.map(ep =>
        '<li class="endpoint-item">'
        +'<span class="method-badge method-'+ep.method+'">'+ep.method+'</span>'
        +'<span class="ep-path">'+esc(ep.path)+'</span>'
        +'<span class="ep-desc">'+esc(ep.description)+'</span>'
        +'</li>').join('')
      +'</ul></div></div>';
  }).join('');

  document.querySelectorAll('.api-card').forEach(card => {
    card.addEventListener('click', () => { card.classList.toggle('expanded'); });
  });
}

function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('search').addEventListener('input', render);
document.getElementById('cat-filter').addEventListener('change', render);
document.getElementById('btn-print').addEventListener('click', () => window.print());
</script>
</body>
</html>
