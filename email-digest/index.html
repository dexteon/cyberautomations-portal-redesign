}

h2{

  color:var(--faint);margin:28px 0 10px;
  display:flex;align-items:center;gap:10px;
}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.count-badge{

}
.list{border:1px solid var(--border);border-radius:4px;overflow:hidden}
.row{display:flex;gap:12px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--surface-2)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface)}
.acct{

  border:1px solid var(--border);border-radius:3px;padding:1px 6px;
  min-width:34px;text-align:center;flex:none;font-family:var(--mono)
}
.who{flex:none;width:180px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj{flex:1;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj .snip{color:var(--muted);font-size:12px}
.t{flex:none;color:var(--faint);font-size:11.5px;white-space:nowrap;font-family:var(--mono)}
.star{color:var(--accent)}
footer{margin-top:40px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--border);padding-top:14px}
</style></head>
