<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Agency — 4-Account Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --green: #3fb950;
    --yellow: #d29922; --red: #f85149; --purple: #bc8cff; --orange: #ffa657;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 60px); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  aside { border-right: 1px solid var(--border); padding: 16px; background: var(--panel); }
  main { padding: 20px 24px 120px; overflow-x: hidden; }
  .ctl-group { margin-bottom: 20px; }
  .ctl-group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 8px; }
  .tabs { display: flex; flex-direction: column; gap: 4px; }
  .tab { text-align: left; padding: 8px 10px; background: none; border: 1px solid transparent; border-radius: 6px; color: var(--text); cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .tab:hover { background: var(--panel2); }
  .tab.active { background: var(--panel2); border-color: var(--border); }
  .tab .badge { font-size: 11px; color: var(--dim); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
  .toggle-row { display: flex; align-items: center; gap: 8px; padding: 5px 2px; font-size: 13px; cursor: pointer; color: var(--text); }
  .toggle-row input { accent-color: var(--accent); }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset { padding: 5px 9px; font-size: 12px; border: 1px solid var(--border); border-radius: 20px; background: none; color: var(--text); cursor: pointer; }
  .preset:hover { border-color: var(--accent); color: var(--accent); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .metric { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; overflow: hidden; min-width: 0; cursor: default; }
  .metric.link { cursor: pointer; }
  .metric.link:hover { border-color: var(--accent); }
  .metric .num { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .metric .lbl { color: var(--dim); font-size: 12px; margin-top: 2px; }
  section.card, details.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 18px; }
  section.card h2, details.card summary h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  details.card summary { cursor: pointer; list-style: none; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary h2 { margin-bottom: 0; }
  details.card summary .chev { margin-left: auto; color: var(--dim); font-size: 11px; }
  details.card[open] > summary { margin-bottom: 10px; }
  details.inner { margin-top: 14px; }
  details.inner summary { cursor: pointer; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; list-style: none; }
  details.inner summary::-webkit-details-marker { display: none; }
  details.inner summary::after { content: " ▸"; }
  details.inner[open] summary::after { content: " ▾"; }
  .tbl-wrap { overflow-x: auto; }
  td.sender { word-break: break-all; }
  .bar-row { display: grid; grid-template-columns: minmax(120px, 220px) 1fr 52px; gap: 10px; align-items: center; padding: 3px 0; font-size: 12.5px; }
  .bar-row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .bar-track { background: var(--panel2); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-row .val { text-align: right; color: var(--dim); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--panel2); vertical-align: top; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; border: 1px solid; }
  .pill.promo { color: var(--yellow); border-color: var(--yellow); }
  .pill.receipt { color: var(--green); border-color: var(--green); }
  .pill.finance { color: var(--accent); border-color: var(--accent); }
  .pill.career { color: var(--purple); border-color: var(--purple); }
  .pill.bill { color: var(--orange); border-color: var(--orange); }
  .review-item { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--panel2); }
  .review-item .ri-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .review-item .ri-sender { font-weight: 600; font-size: 13px; }
  .review-item .ri-issue { color: var(--dim); font-size: 12.5px; margin-bottom: 8px; }
  .ri-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .ri-opt { padding: 4px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 14px; background: none; color: var(--text); cursor: pointer; }
  .ri-opt:hover { border-color: var(--accent); }
  .ri-opt.sel { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
  .promptbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 12px 24px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
  .promptbar pre { white-space: pre-wrap; font-size: 12px; color: var(--text); max-height: 90px; overflow-y: auto; font-family: ui-monospace, Consolas, monospace; }
  .copy-btn { padding: 9px 18px; background: var(--accent); color: #04121f; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .copy-btn:hover { filter: brightness(1.1); }
  .acct-note { font-size: 12px; color: var(--dim); margin-bottom: 12px; }
  .flex-wrap-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 10px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--border); font-size: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>📧 Email Agency — Backlog Run 1</h1>
  <span class="sub">2026-07-11 · 4 accounts · archive-only (zero deletions) · correspondence starred + important</span>
</header>
<div class="layout">
<aside>
  <div class="ctl-group">
    <h3>Account</h3>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="ctl-group">
    <h3>Sections</h3>
    <label class="toggle-row"><input type="checkbox" data-sec="senders" checked> Archived by sender</label>
    <label class="toggle-row"><input type="checkbox" data-sec="filters" checked> Filters &amp; policies</label>
    <label class="toggle-row"><input type="checkbox" data-sec="trends" checked> Inbox trends</label>
    <label class="toggle-row"><input type="checkbox" data-sec="subs" checked> Subscriptions (t91)</label>
    <label class="toggle-row"><input type="checkbox" data-sec="protected" checked> Protection coverage</label>
    <label class="toggle-row"><input type="checkbox" data-sec="review" checked> Review queue</label>
  </div>
  <div class="ctl-group">
    <h3>Presets</h3>
    <div class="presets">
      <button class="preset" data-preset="overview">Overview</button>
      <button class="preset" data-preset="cleanup">Cleanup focus</button>
      <button class="preset" data-preset="money">Money &amp; subs</button>
      <button class="preset" data-preset="decide">Decide reviews</button>
    </div>
  </div>
</aside>
<main id="main"></main>
</div>
<div class="promptbar">
  <pre id="prompt"></pre>
  <button class="copy-btn" id="copy">Copy prompt</button>
</div>
<script>
const ACCTS = {
  tm:  { color:'#58a6ff', email:'teonmoore@gmail.com', role:'Personal · bills · legal · recruiters', starred:71, archived:113,
    note:'71 sent messages starred+important. 13 promo senders skip inbox; Amazon order mail labeled Receipt/Order and kept visible.',
    senders:[['LG Electronics',40],['AwardWallet',24],['Glassdoor Jobs',21],['Monarch',21],['Twilio growth',3],['TalentNest',2],['DIRECTV',1],['Frontier Airlines',1]],
    rules:[['reply@email-lge.com','promo',1],['DIRECTV@message.att-mail.com','promo',1],['noreply@glassdoor.com','promo',1],['info@awardwallet.com','promo',1],['flights@emails.flyfrontier.com','promo',1],['product-support@infosecinstitute.com','promo',1],['growth@growth.twilio.com','promo',1],['notifications@talentnest.com','promo',1],['email@email.monarch.com','promo',1],['reply@rs.email.nextdoor.com','promo',1],['hello@mktg.earnbetter.com','promo',1],['clearme@express.medallia.com','promo',1],['no-reply@contact.goodrx.com','promo',1],['order-update@amazon.com','receipt',0],['shipment-tracking@amazon.com','receipt',0]],
    trends:['category:promotions and updates both capped (100+ each)','Inbox older than 6m/1y/2y: Amazon-dominated long tail back to 2018','Unread pile driven by job alerts/notifications','Untouched by design: Amex/Chase/TransUnion fraud alerts, Inova/Rula medical, Google/Bitwarden/GitHub security'] },
  td:  { color:'#3fb950', email:'teondextermoore@gmail.com', role:'Finance · statements · job pipeline', starred:4, archived:177,
    note:'Finance senders (8 institutions) labeled but stay in inbox. LinkedIn career-protected — labeled, never archived (active NYC job campaign).',
    senders:[['EC-Council',100],['CORT Furniture',36],['HelloFresh',23],['G2A.COM',10],['LensCrafters',8],['Hostwinds',3],['Fandango',3],['Coursera',1]],
    rules:[['creditkarma+capitalone+fidelity+schwab+betterment+coinbase+amex+revolut','finance',0],['synchronyfinancial.com','bill',0],['linkedin.com','career',0],['cortfurnitureoutlet.com','promo',1],['e.lenscrafters.com','promo',1],['eccouncil.org','promo',1],['g2a.com','promo',1],['rioscontact.me','promo',1],['fandango.com','promo',1],['hostwinds.com','promo',1],['isemag-email.com','promo',1],['a.hellofresh.com','promo',1],['m.learn.coursera.org','promo',1]],
    trends:['LinkedIn floods every category (job alerts, recommendations, network) — all capped at 100','Promotions: retail marketing + fraternity mail + one spammy sender (rioscontact.me)','Dormant marketing threads back to 2018','EC-Council backlog exceeds 100 — more to sweep in pass 2'] },
  t91: { color:'#bc8cff', email:'teonmoore121691@gmail.com', role:'Receipts · shopping · subscriptions', starred:0, archived:680,
    note:'Zero sent mail — pure inbound account, so no correspondence risk. Receipts (Uber, PayPal) and bills (Netflix, Spotify, BofA) labeled, never hidden.',
    senders:[['Scott\'s Cheap Flights',222],['Food Lion',149],['Astrology.com (ad ESP)',140],['AB InBev / Shop Beer Gear',68],['Society6',60],['Georgia Aquarium',25],['The Hustle',9],['Circle.so',7],['Honey',0]],
    rules:[['reply.foodlionemail.com','promo',1],['my.joinhoney.com','promo',1],['bc.society6.com','promo',1],['scottscheapflights.com','promo',1],['email.georgiaaquarium.org','promo',1],['thehustle.co','promo',1],['mail.astrology.com','promo',1],['email.ab-inbev.com','promo',1],['circle.so','promo',1],['noreply@uber.com','receipt',0],['service@paypal.com','receipt',0],['netflix.com','bill',0],['spotify.com','bill',0],['ealerts.bankofamerica.com','finance',0]],
    trends:['Every category + age bucket capped at 500 — deepest backlog of the OAuth accounts','Home Depot is the #1 promo sender (94+) but mixes receipts — filter blocked, needs your call','Astrology.com ESP proxies third-party advertisers','Long tail beyond top-15 senders remains for pass 2'],
    subs:['Netflix','Spotify','Google Play','Google One','Disney+','Bank of America statements','Synchrony (Prime Store Card)'] },
  jf:  { color:'#ffa657', email:'jasonfox777@gmail.com', role:'Alias / persona (IMAP only)', starred:21, archived:1139,
    note:'21 sent messages flagged; protected-sender list built from all Sent recipients. No server-side filters on IMAP — 15 policy entries applied agent-side each run.',
    senders:[['J.Crew',200],['Steam',199],['Domino\'s',200],['Bahia Principe',113],['LinkedIn messages',94],['Match.com (both mailers)',87],['NoBull',61],['LinkedIn updates',57],['AdultFriendFinder',51],['Digiseller',23],['McDonald\'s',21],['dyad.sh newsletter',13],['oplata.info',11],['Aftershoot',9]],
    rules:[['jcrew@mail.jcrew.com','promo',1],['mailer@connect.match.com','promo',1],['matchmail@connect.match.com','promo',1],['connect@em.nobullproject.com','promo',1],['noreply@steampowered.com','promo',1],['offers@e-offers.dominos.com','promo',1],['no-reply@digiseller.com','promo',1],['McDonalds@m.mcdonalds.com','promo',1],['team@adultfriendfinder.com','promo',1],['bahia-principe@emails...','promo',1],['updates-noreply@linkedin.com','promo',1],['messages-noreply@linkedin.com','promo',1],['newsletter@dyad.sh','promo',1],['no-reply@oplata.info','promo',1],['team@aftershoot.com','promo',1]],
    trends:['~3-4 msgs/day, dominated by dating/retail/gaming marketing','J.Crew, Steam, Domino\'s all hit the 200-per-run archive cap — more remains','500-message sample covered Feb–Jul 2026; older history not yet profiled'],
    protectedList:['teonmoore121691@gmail.com','katrina.pauley@gmail.com','clopicco@outlook.com','will@dyad.sh','csr.help@pof.com','vtext/sprint SMS gateways'] }
};
const REVIEW = [
  { id:'homedepot', acct:'t91', sender:'mg.homedepot.com', issue:'Highest-volume promo sender (94+) but the domain mixes receipts with marketing — skip-inbox filter was blocked over receipt-mixing risk.',
    opts:['Filter promo subaddress only','Leave in inbox','Decide later'] },
  { id:'ctrxhs', acct:'t91', sender:'ctrxhs@gmail.com', issue:'Bulk-frequency sender (~23 hits) behind a personal-looking Gmail address.',
    opts:['Investigate first','Filter as promo','Leave alone','Decide later'] },
  { id:'discord', acct:'t91', sender:'noreply@discord.com', issue:'Mixes account/security notices with server digests.',
    opts:['Filter digests only','Leave unfiltered','Decide later'] },
  { id:'apa', acct:'td', sender:'apa1906.net (Alpha Phi Alpha)', issue:'Org affiliation mail, not spam — left untouched.',
    opts:['Label + keep in inbox','Label + archive old','Leave as is','Decide later'] },
  { id:'monarch2', acct:'tm', sender:'hello@updates.monarch.com', issue:'Second Monarch sender — hit the 15-filter cap this run.',
    opts:['Add filter in pass 2','Skip','Decide later'] },
  { id:'affsec', acct:'jf', sender:'AdultFriendFinder security notices', issue:'One "login security notification" was archived under the sender-level bulk policy.',
    opts:['Carve out security subjects','Keep sender-level policy','Decide later'] }
];
const state = { acct:'all', secs:{senders:1,filters:1,trends:1,subs:1,protected:1,review:1}, decisions:{}, pass2:false };
REVIEW.forEach(r => state.decisions[r.id] = 'Decide later');

const PILLNAME = {promo:'Newsletter/Promo · skip inbox', receipt:'Receipt/Order · stays', finance:'Finance/Statement · stays', career:'Career/Recruiter · protected', bill:'Bill/Payment · stays'};

function tabs() {
  const el = document.getElementById('tabs');
  const mk = (id, label, count) => `<button class="tab ${state.acct===id?'active':''}" data-acct="${id}"><span>${id!=='all'?`<span class="dot" style="background:${ACCTS[id].color}"></span>`:''}${label}</span><span class="badge">${count}</span></button>`;
  el.innerHTML = mk('all','All accounts','2,109 archived') + Object.keys(ACCTS).map(k=>mk(k, k+' — '+ACCTS[k].email.split('@')[0], ACCTS[k].archived+' arch.')).join('');
  el.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.acct = b.dataset.acct; updateAll(); });
}
function bar(name, val, max, color) {
  const w = max ? Math.max(1.5, val/max*100) : 0;
  return `<div class="bar-row"><span class="name">${name}</span><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div><span class="val mono">${val}</span></div>`;
}
function renderPreview() {
  const m = document.getElementById('main');
  const all = state.acct==='all';
  const keys = all ? Object.keys(ACCTS) : [state.acct];
  const tot = k => keys.reduce((s,a)=>s+ACCTS[a][k],0);
  const nFilters = keys.reduce((s,a)=>s+ACCTS[a].rules.length,0);
  const nReview = all ? REVIEW.length : REVIEW.filter(r=>r.acct===state.acct).length;
  let h = `<div class="metrics">
    <div class="metric"><div class="num" style="color:var(--green)">${tot('starred').toLocaleString()}</div><div class="lbl">correspondence protected (starred + important)</div></div>
    <div class="metric"><div class="num" style="color:var(--accent)">${nFilters.toLocaleString()}</div><div class="lbl">filters / policies created</div></div>
    <div class="metric"><div class="num" style="color:var(--yellow)">${tot('archived').toLocaleString()}</div><div class="lbl">messages archived (0 deleted)</div></div>
    <div class="metric link" id="jump-review"><div class="num" style="color:var(--red)">${nReview}</div><div class="lbl">items needing your decision →</div></div>
  </div>`;
  if (all && state.secs.senders) {
    const combined = Object.keys(ACCTS).flatMap(k => ACCTS[k].senders.map(s => [s[0], s[1], ACCTS[k].color])).sort((x,y)=>y[1]-x[1]).slice(0,10);
    const cmax = combined[0][1];
    h += `<section class="card"><h2>🏆 Top 10 archived senders — all accounts</h2>` + combined.map(s=>bar(s[0],s[1],cmax,s[2])).join('') + `</section>`;
  }
  for (const k of keys) {
    const a = ACCTS[k];
    h += `<details class="card" open><summary><h2><span class="dot" style="background:${a.color}"></span>${a.email} <span style="color:var(--dim);font-weight:400;font-size:12px">— ${a.role}</span><span class="chev">${a.archived.toLocaleString()} archived · ${a.rules.length} rules ▾</span></h2></summary><div class="acct-note">${a.note}</div>`;
    if (state.secs.senders) {
      const max = Math.max(...a.senders.map(s=>s[1]));
      h += `<h2 style="font-size:12px;color:var(--dim)">ARCHIVED BY SENDER</h2>` + a.senders.map(s=>bar(s[0],s[1],max,a.color)).join('');
    }
    if (state.secs.filters) {
      h += `<details class="inner"${all?'':' open'}><summary>Filters / policies (${a.rules.length})</summary><div class="tbl-wrap"><table><tr><th>Sender</th><th>Rule</th></tr>` +
        a.rules.map(f=>`<tr><td class="mono sender" style="font-size:11.5px">${f[0]}</td><td><span class="pill ${f[1]}">${PILLNAME[f[1]]}</span></td></tr>`).join('') + `</table></div></details>`;
    }
    if (state.secs.trends) {
      h += `<h2 style="font-size:12px;color:var(--dim);margin-top:14px">TRENDS</h2><ul style="padding-left:18px;font-size:12.5px;color:var(--text)">` + a.trends.map(t=>`<li style="margin:3px 0">${t}</li>`).join('') + `</ul>`;
    }
    if (state.secs.subs && a.subs) {
      h += `<h2 style="font-size:12px;color:var(--dim);margin-top:14px">RECURRING SUBSCRIPTIONS DETECTED</h2><div class="flex-wrap-list">` + a.subs.map(s=>`<span class="chip">💳 ${s}</span>`).join('') + `</div>`;
    }
    if (state.secs.protected && a.protectedList) {
      h += `<h2 style="font-size:12px;color:var(--dim);margin-top:14px">PROTECTED SENDERS (never archived)</h2><div class="flex-wrap-list">` + a.protectedList.map(s=>`<span class="chip">🔒 ${s}</span>`).join('') + `</div>`;
    }
    h += `</details>`;
  }
  if (state.secs.review) {
    const items = REVIEW.filter(r => state.acct==='all' || r.acct===state.acct);
    if (items.length) {
      h += `<section class="card" id="review-sec"><h2>🟡 Review queue — pick decisions, then copy the prompt below</h2>` + items.map(r =>
        `<div class="review-item"><div class="ri-head"><span class="ri-sender"><span class="dot" style="background:${ACCTS[r.acct].color}"></span>${r.sender}</span><span class="badge mono" style="color:var(--dim)">${r.acct}</span></div><div class="ri-issue">${r.issue}</div><div class="ri-opts">` +
        r.opts.map(o=>`<button class="ri-opt ${state.decisions[r.id]===o?'sel':''}" data-rid="${r.id}" data-opt="${o}">${o}</button>`).join('') + `</div></div>`).join('');
      h += `<label class="toggle-row" style="margin-top:6px"><input type="checkbox" id="pass2" ${state.pass2?'checked':''}> Also run <b>&nbsp;pass 2&nbsp;</b> (next-tier senders + capped leftovers: J.Crew / Steam / Domino's on jf, EC-Council on td, Monarch #2 on tm)</label></section>`;
    }
  }
  m.innerHTML = h;
  m.querySelectorAll('.ri-opt').forEach(b => b.onclick = () => { state.decisions[b.dataset.rid] = b.dataset.opt; updateAll(); });
  const p2 = document.getElementById('pass2'); if (p2) p2.onchange = e => { state.pass2 = e.target.checked; updatePrompt(); };
  const jr = document.getElementById('jump-review');
  if (jr) jr.onclick = () => { const s = document.getElementById('review-sec'); if (s) s.scrollIntoView({behavior:'smooth'}); else { state.secs.review = 1; const cb = document.querySelector('[data-sec="review"]'); if (cb) cb.checked = true; renderPreview(); document.getElementById('review-sec')?.scrollIntoView({behavior:'smooth'}); } };
}
function updatePrompt() {
  const parts = [];
  const D = state.decisions;
  if (D.homedepot === 'Filter promo subaddress only') parts.push('on t91, create a Newsletter/Promo skip-inbox filter for Home Depot promo subaddresses only (keep receipt mail in the inbox)');
  if (D.homedepot === 'Leave in inbox') parts.push('leave mg.homedepot.com unfiltered on t91');
  if (D.ctrxhs === 'Investigate first') parts.push('investigate who ctrxhs@gmail.com is (t91) before filtering');
  if (D.ctrxhs === 'Filter as promo') parts.push('filter ctrxhs@gmail.com as Newsletter/Promo skip-inbox on t91');
  if (D.ctrxhs === 'Leave alone') parts.push('leave ctrxhs@gmail.com alone');
  if (D.discord === 'Filter digests only') parts.push('filter Discord server digests only on t91, keeping account/security notices in the inbox');
  if (D.discord === 'Leave unfiltered') parts.push('leave Discord unfiltered');
  if (D.apa === 'Label + keep in inbox') parts.push('label apa1906.net (Alpha Phi Alpha) mail on td but keep it in the inbox');
  if (D.apa === 'Label + archive old') parts.push('label apa1906.net mail on td and archive items older than 6 months');
  if (D.apa === 'Leave as is') parts.push('leave apa1906.net untouched');
  if (D.monarch2 === 'Add filter in pass 2') parts.push('add a skip-inbox filter for hello@updates.monarch.com on tm');
  if (D.affsec === 'Carve out security subjects') parts.push('update the jf archive policies to exclude security-notification subjects (restore the archived AFF login notice to the inbox)');
  if (D.affsec === 'Keep sender-level policy') parts.push('keep jf sender-level policies as they are');
  let txt;
  if (!parts.length && !state.pass2) {
    txt = 'Review the Email Agency run-1 results. (Pick decisions above — this prompt will build itself. Standing rules: archive-only, correspondence stays starred+important, nothing deleted.)';
  } else {
    txt = 'Email Agency follow-up: ' + parts.join('; ') + (parts.length && state.pass2 ? '; then ' : '');
    if (state.pass2) txt += 'run backlog pass 2 with the same sonnet worker pattern — page past the caps for the next tier of bulk senders and finish the capped leftovers (J.Crew/Steam/Domino\'s on jf, EC-Council on td)';
    txt += '. Same guardrails as run 1: archive-only, correspondence protected (starred+important, never archived), no deletions, no sends, no unsubscribes.';
  }
  document.getElementById('prompt').textContent = txt;
}
function updateAll(){ tabs(); renderPreview(); updatePrompt(); }
document.querySelectorAll('[data-sec]').forEach(cb => cb.onchange = () => { state.secs[cb.dataset.sec] = cb.checked ? 1 : 0; renderPreview(); });
document.querySelectorAll('.preset').forEach(b => b.onclick = () => {
  const p = b.dataset.preset;
  const set = o => { for (const k in state.secs) state.secs[k] = o.includes(k) ? 1 : 0; document.querySelectorAll('[data-sec]').forEach(cb => cb.checked = !!state.secs[cb.dataset.sec]); };
  if (p==='overview'){ state.acct='all'; set(['senders','trends','review']); }
  if (p==='cleanup'){ state.acct='all'; set(['senders','filters']); }
  if (p==='money'){ state.acct='t91'; set(['filters','subs','trends']); }
  if (p==='decide'){ state.acct='all'; set(['review']); }
  updateAll();
});
document.getElementById('copy').onclick = () => {
  navigator.clipboard.writeText(document.getElementById('prompt').textContent).then(()=>{
    const b = document.getElementById('copy'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy prompt',1200);
  });
};
updateAll();
</script>
