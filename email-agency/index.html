<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Email Agency · Portal</title>
<style>
:root {
  --bg:        #0d1010;
  --surface:   #141918;
  --surface-2: #1b2120;
  --border:    #263030;
  --border-2:  #324040;
  --text:      #dde5e3;
  --muted:     #8fa89e;
  --faint:     #5c726a;
  --accent:    #b8965a;
  --ok:        #5aab7f;
  --warn:      #c9924a;
  --crit:      #c45a5a;
  --c-promo:   #c9924a;
  --c-receipt: #5aab7f;
  --c-finance: #6b9fc4;
  --c-career:  #9a7fc4;
  --c-bill:    #c48a6b;
  --mono: "SFMono-Regular", Consolas, "Cascadia Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
.mono { font-family: var(--mono); }

/* topbar */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(13,16,16,.96); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 48px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-brand { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.topbar-title { font-size: 13px; font-weight: 600; color: var(--text); }
.topbar-meta { font-size: 11px; color: var(--faint); }
.topbar-back { font-size: 11px; color: var(--faint); }
.topbar-back:hover { color: var(--muted); }

/* layout */
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 48px); }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

/* sidebar */
aside {
  border-right: 1px solid var(--border);
  padding: 20px 16px;
  background: var(--surface);
  overflow-y: auto;
}
.ctl-group { margin-bottom: 24px; }
.ctl-label {
  font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 10px; display: block;
}
.tabs { display: flex; flex-direction: column; gap: 3px; }
.tab {
  text-align: left; padding: 7px 10px;
  background: none; border: 1px solid transparent; border-radius: 4px;
  color: var(--muted); cursor: pointer; font-size: 13px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--sans);
}
.tab:hover { background: var(--surface-2); color: var(--text); }
.tab.active { background: var(--surface-2); border-color: var(--border); color: var(--text); }
.tab .badge { font-size: 10.5px; color: var(--faint); font-family: var(--mono); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; flex-shrink: 0; }
.toggle-row { display: flex; align-items: center; gap: 8px; padding: 5px 4px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.toggle-row:hover { color: var(--text); }
.toggle-row input { accent-color: var(--accent); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset {
  padding: 5px 10px; font-size: 11.5px;
  border: 1px solid var(--border); border-radius: 3px;
  background: none; color: var(--muted); cursor: pointer;
  font-family: var(--sans);
}
.preset:hover { border-color: var(--accent); color: var(--accent); }

/* main */
main { padding: 20px 24px 140px; overflow-x: hidden; }

/* metrics */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
.metric {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  padding: 14px 16px; overflow: hidden; min-width: 0;
  border-left: 3px solid var(--border);
}
.metric.link { cursor: pointer; }
.metric.link:hover { border-color: var(--border-2); }
.metric .num { font-size: 22px; font-weight: 700; font-family: var(--mono); white-space: nowrap; }
.metric .lbl { color: var(--muted); font-size: 11.5px; margin-top: 3px; }

/* cards */
section.card, details.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 16px; margin-bottom: 14px;
}
section.card h2, details.card summary h2 {
  font-size: 13px; font-weight: 650; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
details.card summary { cursor: pointer; list-style: none; }
details.card summary::-webkit-details-marker { display: none; }
details.card summary h2 { margin-bottom: 0; }
details.card summary .chev { margin-left: auto; color: var(--faint); font-size: 11px; font-weight: 400; }
details.card[open] > summary { margin-bottom: 12px; }
details.inner { margin-top: 14px; }
details.inner summary {
  cursor: pointer; font-size: 11px; color: var(--faint);
  text-transform: uppercase; letter-spacing: .1em; list-style: none;
}
details.inner summary::-webkit-details-marker { display: none; }
details.inner summary::after { content: " ▸"; }
details.inner[open] summary::after { content: " ▾"; }
.sec-label {
  font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--faint); margin: 14px 0 8px;
}
.tbl-wrap { overflow-x: auto; margin-top: 8px; }
td.sender { word-break: break-all; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 210px) 1fr 46px; gap: 10px; align-items: center; padding: 3px 0; font-size: 12.5px; }
.bar-row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.bar-track { background: var(--surface-2); border-radius: 3px; height: 12px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; }
.bar-row .val { text-align: right; color: var(--muted); font-family: var(--mono); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; color: var(--faint); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; padding: 5px 8px; border-bottom: 1px solid var(--border); }
td { padding: 6px 8px; border-bottom: 1px solid var(--surface-2); vertical-align: top; color: var(--muted); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 10.5px; font-weight: 700; border: 1px solid; letter-spacing: .04em; }
.pill.promo   { color: var(--c-promo);   border-color: rgba(201,146,74,.4); }
.pill.receipt { color: var(--c-receipt); border-color: rgba(90,171,127,.4); }
.pill.finance { color: var(--c-finance); border-color: rgba(107,159,196,.4); }
.pill.career  { color: var(--c-career);  border-color: rgba(154,127,196,.4); }
.pill.bill    { color: var(--c-bill);    border-color: rgba(196,138,107,.4); }
.review-item {
  border: 1px solid var(--border); border-radius: 4px;
  padding: 12px 14px; margin-bottom: 10px; background: var(--surface-2);
}
.review-item .ri-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.review-item .ri-sender { font-weight: 650; font-size: 13px; color: var(--text); }
.review-item .ri-issue { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
.ri-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.ri-opt {
  padding: 4px 10px; font-size: 12px;
  border: 1px solid var(--border); border-radius: 3px;
  background: none; color: var(--muted); cursor: pointer;
  font-family: var(--sans); transition: border-color .1s, color .1s;
}
.ri-opt:hover { border-color: var(--accent); color: var(--text); }
.ri-opt.sel { background: var(--accent); border-color: var(--accent); color: #0d1010; font-weight: 650; }
.promptbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 12px 24px; display: grid; grid-template-columns: 1fr auto;
  gap: 14px; align-items: center;
}
.promptbar pre { white-space: pre-wrap; font-size: 12px; color: var(--text); max-height: 80px; overflow-y: auto; font-family: var(--mono); }
.copy-btn { padding: 9px 18px; background: var(--accent); color: #0d1010; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 13px; white-space: nowrap; font-family: var(--sans); }
.copy-btn:hover { filter: brightness(1.1); }
.acct-note { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.flex-wrap-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 10px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.hidden { display: none !important; }
@media print {
  body { background: #fff; color: #111; }
  .topbar, aside, .promptbar, .presets, .ri-opts, .copy-btn, #global-search, #btn-ea-print { display: none; }
  .layout { grid-template-columns: 1fr; }
  main { padding: 16px; }
  .metric, section.card, details.card { background: #fff; border-color: #ccc; break-inside: avoid; }
  .metric .num, .metric .lbl { color: #333; }
  table th { color: #555; }
  table td { color: #333; border-bottom-color: #eee; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand">Portal</span>
    <span class="topbar-title">Email Agency</span>
    <span class="topbar-meta">Backlog Run 1 · 2026-07-11 · 4 accounts</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <input type="search" id="global-search" placeholder="Search senders, rules..." style="background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:5px 10px;font-size:12px;width:180px;font-family:var(--sans)">
    <button id="btn-ea-print" style="background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);padding:5px 10px;font-size:11px;cursor:pointer;font-family:var(--sans)">Print / PDF</button>
    <a href="/" class="topbar-back">&larr; Home</a>
    <span id="topbar-updated" style="font-size:11px;color:var(--faint);font-family:var(--mono)"></span>
    <button id="topbar-refresh" style="background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);padding:3px 8px;font-size:11px;cursor:pointer;font-family:var(--sans)" title="Refresh data">&#8635;</button>
  </div>
</div>
<div class="layout">
<aside>
  <div class="ctl-group">
    <span class="ctl-label">Account</span>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="ctl-group">
    <span class="ctl-label">Sections</span>
    <label class="toggle-row"><input type="checkbox" data-sec="senders" checked> Archived by sender</label>
    <label class="toggle-row"><input type="checkbox" data-sec="filters" checked> Filters &amp; policies</label>
    <label class="toggle-row"><input type="checkbox" data-sec="trends" checked> Inbox trends</label>
    <label class="toggle-row"><input type="checkbox" data-sec="subs" checked> Subscriptions (t91)</label>
    <label class="toggle-row"><input type="checkbox" data-sec="protected" checked> Protection coverage</label>
    <label class="toggle-row"><input type="checkbox" data-sec="review" checked> Review queue</label>
  </div>
  <div class="ctl-group">
    <span class="ctl-label">Presets</span>
    <div class="presets">
      <button class="preset" data-preset="overview">Overview</button>
      <button class="preset" data-preset="cleanup">Cleanup focus</button>
      <button class="preset" data-preset="money">Money &amp; subs</button>
      <button class="preset" data-preset="decide">Decide reviews</button>
    </div>
  </div>
</aside>
<main id="main"></main>
</div>
<div class="promptbar">
  <pre id="prompt"></pre>
  <button class="copy-btn" id="copy">Copy prompt</button>
</div>
<script>
const ACCTS = {

    rules:[['jcrew@mail.jcrew.com','promo',1],['mailer@connect.match.com','promo',1],['matchmail@connect.match.com','promo',1],['connect@em.nobullproject.com','promo',1],['noreply@steampowered.com','promo',1],['offers@e-offers.dominos.com','promo',1],['no-reply@digiseller.com','promo',1],['McDonalds@m.mcdonalds.com','promo',1],['team@adultfriendfinder.com','promo',1],['bahia-principe@emails...','promo',1],['updates-noreply@linkedin.com','promo',1],['messages-noreply@linkedin.com','promo',1],['newsletter@dyad.sh','promo',1],['no-reply@oplata.info','promo',1],['team@aftershoot.com','promo',1]],

const REVIEW = [
  { id:'homedepot', acct:'t91', sender:'mg.homedepot.com', issue:'Highest-volume promo sender (94+) but the domain mixes receipts with marketing — skip-inbox filter was blocked over receipt-mixing risk.',

    opts:['Filter digests only','Leave unfiltered','Decide later'] },
  { id:'apa', acct:'td', sender:'apa1906.net (Alpha Phi Alpha)', issue:'Org affiliation mail, not spam — left untouched.',

  { id:'monarch2', acct:'tm', sender:'hello@updates.monarch.com', issue:'Second Monarch sender — hit the 15-filter cap this run.',
    opts:['Add filter in pass 2','Skip','Decide later'] },
  { id:'affsec', acct:'jf', sender:'AdultFriendFinder security notices', issue:'One "login security notification" was archived under the sender-level bulk policy.',
    opts:['Carve out security subjects','Keep sender-level policy','Decide later'] }
];
const state = { acct:'all', secs:{senders:1,filters:1,trends:1,subs:1,protected:1,review:1}, decisions:{}, pass2:false };
REVIEW.forEach(r => state.decisions[r.id] = 'Decide later');
const PILLNAME = {promo:'Newsletter/Promo · skip inbox', receipt:'Receipt/Order · stays', finance:'Finance/Statement · stays', career:'Career/Recruiter · protected', bill:'Bill/Payment · stays'};

function tabs() {
  const el = document.getElementById('tabs');
  const mk = (id, label, count) => `<button class="tab ${state.acct===id?'active':''}" data-acct="${id}"><span>${id!=='all'?`<span class="dot" style="background:${ACCTS[id].color}"></span>`:''}${label}</span><span class="badge">${count}</span></button>`;
  el.innerHTML = mk('all','All accounts','2,109 arch.') + Object.keys(ACCTS).map(k=>mk(k, ACCTS[k].email.split('@')[0], ACCTS[k].archived+' arch.')).join('');
  el.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.acct = b.dataset.acct; updateAll(); });
}
function bar(name, val, max, color) {
  const w = max ? Math.max(1.5, val/max*100) : 0;
  return `<div class="bar-row"><span class="name">${name}</span><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div><span class="val">${val}</span></div>`;
}
function renderPreview() {
  const m = document.getElementById('main');
  const all = state.acct==='all';
  const keys = all ? Object.keys(ACCTS) : [state.acct];
  const tot = k => keys.reduce((s,a)=>s+ACCTS[a][k],0);
  const nFilters = keys.reduce((s,a)=>s+ACCTS[a].rules.length,0);
  const nReview = all ? REVIEW.length : REVIEW.filter(r=>r.acct===state.acct).length;
  let h = `<div class="metrics">
    <div class="metric" style="border-left-color:var(--ok)"><div class="num" style="color:var(--ok)">${tot('starred').toLocaleString()}</div><div class="lbl">correspondence protected</div></div>
    <div class="metric" style="border-left-color:var(--accent)"><div class="num" style="color:var(--accent)">${nFilters.toLocaleString()}</div><div class="lbl">filters / policies created</div></div>
    <div class="metric" style="border-left-color:var(--c-finance)"><div class="num" style="color:var(--c-finance)">${tot('archived').toLocaleString()}</div><div class="lbl">archived (0 deleted)</div></div>
    <div class="metric link" id="jump-review" style="border-left-color:var(--crit)"><div class="num" style="color:var(--crit)">${nReview}</div><div class="lbl">decisions needed →</div></div>
  </div>`;
  if (all && state.secs.senders) {
    const combined = Object.keys(ACCTS).flatMap(k => ACCTS[k].senders.map(s => [s[0], s[1], ACCTS[k].color])).sort((x,y)=>y[1]-x[1]).slice(0,10);
    const cmax = combined[0][1];
    h += `<section class="card"><h2>Top 10 archived senders — all accounts</h2>` + combined.map(s=>bar(s[0],s[1],cmax,s[2])).join('') + `</section>`;
  }
  for (const k of keys) {
    const a = ACCTS[k];
    h += `<details class="card" open><summary><h2><span class="dot" style="background:${a.color}"></span>${a.email} <span style="color:var(--faint);font-weight:400;font-size:12px;margin-left:4px">${a.role}</span><span class="chev">${a.archived.toLocaleString()} archived · ${a.rules.length} rules ▾</span></h2></summary><div class="acct-note">${a.note}</div>`;
    if (state.secs.senders) {
      const max = Math.max(...a.senders.map(s=>s[1]));
      h += `<p class="sec-label">Archived by sender</p>` + a.senders.map(s=>bar(s[0],s[1],max,a.color)).join('');
    }
    if (state.secs.filters) {
      h += `<details class="inner"${all?'':' open'}><summary>Filters / policies (${a.rules.length})</summary><div class="tbl-wrap"><table><tr><th>Sender</th><th>Rule</th></tr>` +
        a.rules.map(f=>`<tr><td class="mono sender" style="font-size:11.5px">${f[0]}</td><td><span class="pill ${f[1]}">${PILLNAME[f[1]]}</span></td></tr>`).join('') + `</table></div></details>`;
    }
    if (state.secs.trends) {
      h += `<p class="sec-label" style="margin-top:14px">Inbox trends</p><ul style="padding-left:18px;font-size:12.5px;color:var(--text)">` + a.trends.map(t=>`<li style="margin:3px 0;color:var(--muted)">${t}</li>`).join('') + `</ul>`;
    }
    if (state.secs.subs && a.subs) {
      h += `<p class="sec-label" style="margin-top:14px">Recurring subscriptions detected</p><div class="flex-wrap-list">` + a.subs.map(s=>`<span class="chip">${s}</span>`).join('') + `</div>`;
    }
    if (state.secs.protected && a.protectedList) {
      h += `<p class="sec-label" style="margin-top:14px">Protected senders (never archived)</p><div class="flex-wrap-list">` + a.protectedList.map(s=>`<span class="chip">${s}</span>`).join('') + `</div>`;
    }
    h += `</details>`;
  }
  if (state.secs.review) {
    const items = REVIEW.filter(r => state.acct==='all' || r.acct===state.acct);
    if (items.length) {
      h += `<section class="card" id="review-sec"><h2>Review queue — pick decisions, then copy prompt</h2>` + items.map(r =>
        `<div class="review-item"><div class="ri-head"><span class="ri-sender"><span class="dot" style="background:${ACCTS[r.acct].color}"></span>${r.sender}</span><span style="font-size:11px;color:var(--faint);font-family:var(--mono)">${r.acct}</span></div><div class="ri-issue">${r.issue}</div><div class="ri-opts">` +
        r.opts.map(o=>`<button class="ri-opt ${state.decisions[r.id]===o?'sel':''}" data-rid="${r.id}" data-opt="${o}">${o}</button>`).join('') + `</div></div>`).join('');
      h += `<label class="toggle-row" style="margin-top:6px"><input type="checkbox" id="pass2" ${state.pass2?'checked':''}> Also run <b>&nbsp;pass 2&nbsp;</b> (next-tier senders + capped leftovers)</label></section>`;
    }
  }
  m.innerHTML = h;
  m.querySelectorAll('.ri-opt').forEach(b => b.onclick = () => { state.decisions[b.dataset.rid] = b.dataset.opt; updateAll(); });
  const p2 = document.getElementById('pass2'); if (p2) p2.onchange = e => { state.pass2 = e.target.checked; updatePrompt(); };
  const jr = document.getElementById('jump-review');
  if (jr) jr.onclick = () => { const s = document.getElementById('review-sec'); if (s) s.scrollIntoView({behavior:'smooth'}); else { state.secs.review = 1; const cb = document.querySelector('[data-sec="review"]'); if (cb) cb.checked = true; renderPreview(); document.getElementById('review-sec')?.scrollIntoView({behavior:'smooth'}); } };
}
function updatePrompt() {
  const parts = [];
  const D = state.decisions;
  if (D.homedepot === 'Filter promo subaddress only') parts.push('on t91, create a Newsletter/Promo skip-inbox filter for Home Depot promo subaddresses only (keep receipt mail in the inbox)');
  if (D.homedepot === 'Leave in inbox') parts.push('leave mg.homedepot.com unfiltered on t91');
  if (D.ctrxhs === 'Investigate first') parts.push('investigate who ctrxhs@gmail.com is (t91) before filtering');
  if (D.ctrxhs === 'Filter as promo') parts.push('filter ctrxhs@gmail.com as Newsletter/Promo skip-inbox on t91');
  if (D.ctrxhs === 'Leave alone') parts.push('leave ctrxhs@gmail.com alone');
  if (D.discord === 'Filter digests only') parts.push('filter Discord server digests only on t91, keeping account/security notices in the inbox');
  if (D.discord === 'Leave unfiltered') parts.push('leave Discord unfiltered');
  if (D.apa === 'Label + keep in inbox') parts.push('label apa1906.net (Alpha Phi Alpha) mail on td but keep it in the inbox');
  if (D.apa === 'Label + archive old') parts.push('label apa1906.net mail on td and archive items older than 6 months');
  if (D.apa === 'Leave as is') parts.push('leave apa1906.net untouched');
  if (D.monarch2 === 'Add filter in pass 2') parts.push('add a skip-inbox filter for hello@updates.monarch.com on tm');
  if (D.affsec === 'Carve out security subjects') parts.push('update the jf archive policies to exclude security-notification subjects (restore the archived AFF login notice to the inbox)');
  if (D.affsec === 'Keep sender-level policy') parts.push('keep jf sender-level policies as they are');
  let txt;
  if (!parts.length && !state.pass2) {
    txt = 'Review the Email Agency run-1 results. (Pick decisions above — this prompt will build itself. Standing rules: archive-only, correspondence stays starred+important, nothing deleted.)';
  } else {
    txt = 'Email Agency follow-up: ' + parts.join('; ') + (parts.length && state.pass2 ? '; then ' : '');
    if (state.pass2) txt += 'run backlog pass 2 with the same sonnet worker pattern — page past the caps for the next tier of bulk senders and finish the capped leftovers (J.Crew/Steam/Domino\'s on jf, EC-Council on td)';
    txt += '. Same guardrails as run 1: archive-only, correspondence protected (starred+important, never archived), no deletions, no sends, no unsubscribes.';
  }
  document.getElementById('prompt').textContent = txt;
}
function updateAll(){ tabs(); renderPreview(); updatePrompt(); }
document.querySelectorAll('[data-sec]').forEach(cb => cb.onchange = () => { state.secs[cb.dataset.sec] = cb.checked ? 1 : 0; renderPreview(); });
document.querySelectorAll('.preset').forEach(b => b.onclick = () => {
  const p = b.dataset.preset;
  const set = o => { for (const k in state.secs) state.secs[k] = o.includes(k) ? 1 : 0; document.querySelectorAll('[data-sec]').forEach(cb => cb.checked = !!state.secs[cb.dataset.sec]); };
  if (p==='overview'){ state.acct='all'; set(['senders','trends','review']); }
  if (p==='cleanup'){ state.acct='all'; set(['senders','filters']); }
  if (p==='money'){ state.acct='t91'; set(['filters','subs','trends']); }
  if (p==='decide'){ state.acct='all'; set(['review']); }
  updateAll();
});
document.getElementById('copy').onclick = () => {
  navigator.clipboard.writeText(document.getElementById('prompt').textContent).then(()=>{
    const b = document.getElementById('copy'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy prompt',1200);
  });
};
document.getElementById('btn-ea-print').addEventListener('click', () => window.print());
document.getElementById('global-search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('#main .card, #main details.card').forEach(card => {
    if (!q) { card.classList.remove('hidden'); return; }
    const text = card.textContent.toLowerCase();
    card.classList.toggle('hidden', !text.includes(q));
  });
});
updateAll();

(function(){
  function loadFreshness(){
    fetch('/freshness.json?t='+Date.now()).then(r=>r.json()).then(f=>{
      const e=f['email-agency'];
      document.getElementById('topbar-updated').textContent='Updated '+(e?e.as_of:'unknown');
    }).catch(()=>{document.getElementById('topbar-updated').textContent='Updated: unknown';});
  }
  loadFreshness();
  document.getElementById('topbar-refresh').addEventListener('click',function(){
    this.textContent='...';location.reload();
  });
})();
</script>
</body>
